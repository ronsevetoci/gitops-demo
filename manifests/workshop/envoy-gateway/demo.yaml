apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-demo
  namespace: workshop-envoy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-demo
  template:
    metadata:
      labels:
        app: envoy-demo
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:5678
            - -text=OKE Envoy Gateway workshop
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-demo
  namespace: workshop-envoy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: envoy-demo
  ports:
    - name: http
      port: 80
      targetPort: http
