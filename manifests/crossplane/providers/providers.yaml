# RBAC: ServiceAccount + ClusterRole for OCI provider
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-provider-oci
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-provider-oci
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-provider-oci
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-provider-oci
subjects:
  - kind: ServiceAccount
    name: crossplane-provider-oci
    namespace: crossplane-system

---
# Workload Identity runtime for OCI providers
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: oci-workload-identity-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          serviceAccountName: crossplane-provider-oci
          nodeSelector:
            oke.oraclecloud.com/pool.name: karpenter
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
          containers:
            - name: package-runtime
              env:
                - name: OCI_RESOURCE_PRINCIPAL_VERSION
                  value: "2.2"
                - name: OCI_RESOURCE_PRINCIPAL_WORKLOAD_IDENTITY
                  value: "1"

---
# OCI Credentials via Workload Identity (no credentials needed)
apiVersion: v1
kind: Secret
metadata:
  name: oci-creds
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  credentials: |
    {
      "auth": "OKEWorkloadIdentity"
    }

---
# Family OCI provider (covers all OCI resources)
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-family-oci
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  package: ghcr.io/oracle/provider-family-oci:v1.1.0
  runtimeConfigRef:
    name: oci-workload-identity-runtime

---
# Kubernetes provider for in-cluster resources (ConfigMaps, etc)
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  package: ghcr.io/crossplane-contrib/provider-kubernetes:v0.14.0

---
# Composition Functions (required for pipeline mode compositions)
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-patch-and-transform
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  package: ghcr.io/crossplane/function-patch-and-transform:v0.2.1

---
# OCI ProviderConfig (modern namespaced, workload identity)
apiVersion: oci.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  credentials:
    source: Secret
    secretRef:
      name: oci-creds
      namespace: crossplane-system
      key: credentials

---
# In-cluster Kubernetes ProviderConfig
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: in-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  credentials:
    source: InjectedIdentity