apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ronsevetoci/gitops-demo.git
    targetRevision: workshop
    path: apps/workshop
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy: {}
