repoURL: https://github.com/ronsevetoci/gitops-demo.git
targetRevision: master

# OCI Infrastructure Configuration
oci:
  region: eu-frankfurt-1
  compartmentId: ocid1.compartment.oc1..aaaaaaaayevnkjfyjb6nglndfrvgoy7hciclgf4kq7ioulokey7xfpixjhxa
  
  # Karpenter/Node pool configuration
  karpenter:
    nodeCompartmentId: ocid1.compartment.oc1..aaaaaaaayevnkjfyjb6nglndfrvgoy7hciclgf4kq7ioulokey7xfpixjhxa
    primarySubnetId: ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaahwjd57to4sdamx4tjkz2fxwymxdivb5zk6pfuwkiauvscgf5ywdq
    secondarySubnetId: ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaa2jo64gdsywfmk2cq3c62fykegcqhyyv52y3iawtryhgw2qtcgkrq
    primaryNsgId: ocid1.networksecuritygroup.oc1.eu-frankfurt-1.aaaaaaaan3so3df64lg2lpzubsut4fu437b3uwayjclkpkiymu7xjatecvjq
    secondaryNsgId: ocid1.networksecuritygroup.oc1.eu-frankfurt-1.aaaaaaaagpgbuvfknthclsnhvn26yfsnacjjuvt42jxkn6dvma4eghylwffq
    clusterId: ocid1.cluster.oc1.eu-frankfurt-1.aaaaaaaavf3sjplaoujrlcnfyi4pzd3yaqmnlycvgzu4efq4lctxcqrsdjaq
  
  # Crossplane configuration
  crossplane:
    compartmentId: ocid1.compartment.oc1..aaaaaaaayevnkjfyjb6nglndfrvgoy7hciclgf4kq7ioulokey7xfpixjhxa
    clusterId: ocid1.cluster.oc1.eu-frankfurt-1.aaaaaaaaonnpuxjxlj3frc54rotpmbg7k5m53au5faclcwivdc7yvafb67oq
  
  # Gateway API configuration
  gatewayapi:
    nsgId: ocid1.networksecuritygroup.oc1.eu-frankfurt-1.aaaaaaaagpgbuvfknthclsnhvn26yfsnacjjuvt42jxkn6dvma4eghylwffq
  
  # Stack/Demo configuration
  stacks:
    demo:
      compartmentId: ocid1.compartment.oc1..aaaaaaaayevnkjfyjb6nglndfrvgoy7hciclgf4kq7ioulokey7xfpixjhxa
      redisSubnetId: ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaahwjd57to4sdamx4tjkz2fxwymxdivb5zk6pfuwkiauvscgf5ywdq
      redisNsgId: ocid1.networksecuritygroup.oc1.eu-frankfurt-1.aaaaaaaan3so3df64lg2lpzubsut4fu437b3uwayjclkpkiymu7xjatecvjq

# Component enablement flags
components:
  karpenter:
    enabled: true
    syncWave: "5"
  karpenterNodepools:
    enabled: true
    syncWave: "7"
  crossplaneSystem:
    enabled: true
    syncWave: "10"
  crossplaneProviders:
    enabled: true
    syncWave: "12"
  crossplaneCompositions:
    enabled: true
    syncWave: "15"
  gatewayapiIam:
    enabled: true
    syncWave: "11"
  envoyGateway:
    enabled: true
    syncWave: "15"
  gatewayObjects:
    enabled: true
    syncWave: "25"
  stacks:
    enabled: true
    syncWave: "100"

# Helm chart versions and sources
charts:
  crossplane:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    version: ">=1.0.0"
  envoyGateway:
    repoURL: registry-1.docker.io/envoyproxy
    chart: gateway-helm
    version: "1.8.0"

# Provider package versions
providers:
  familyOci:
    package: ghcr.io/oracle/provider-family-oci:v1.1.0
  kubernetes:
    package: ghcr.io/crossplane-contrib/provider-kubernetes:v0.14.0
  functions:
    patchAndTransform: ghcr.io/crossplane/function-patch-and-transform:v0.2.1

# Argo CD configuration
argocd:
  namespace: argocd
  project: platform
  destination:
    server: https://kubernetes.default.svc
  sourceRepos:
    - "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

# Sync policies
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - SkipDryRunOnMissingResource=true
