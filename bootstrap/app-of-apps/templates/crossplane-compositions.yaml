{{- if .Values.components.crossplaneCompositions.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: compositions
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.components.crossplaneCompositions.syncWave | quote }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: manifests/crossplane/compositions
  destination:
    server: {{ .Values.argocd.destination.server }}
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: {{ .Values.syncPolicy.automated.prune }}
      selfHeal: {{ .Values.syncPolicy.automated.selfHeal }}
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
{{- end }}
