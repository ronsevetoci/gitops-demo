{{- if .Values.components.gatewayapiIam.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatewayapi-iam
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.components.gatewayapiIam.syncWave | quote }}
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: manifests/gatewayapi-iam
    helm:
      releaseName: gatewayapi-iam
      values: |
        compartmentId: {{ .Values.oci.compartmentId | quote }}
  destination:
    server: {{ .Values.argocd.destination.server }}
    namespace: {{ .Values.argocd.namespace }}
  syncPolicy:
    automated:
      prune: {{ .Values.syncPolicy.automated.prune }}
      selfHeal: {{ .Values.syncPolicy.automated.selfHeal }}
    syncOptions:
      {{- range .Values.syncPolicy.syncOptions }}
      - {{ . }}
      {{- end }}
{{- end }}
